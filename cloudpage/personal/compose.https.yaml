services:
  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:8080"
      - "0.0.0.0:${CLOUDPAGE_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./tls-data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ./tls-config
        target: /config
        bind: {create_host_path: false}
    networks: [private]
