name: cloudpage
services:
  web:
    image: cloudpage:local
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    init: true
    ports:
      - "127.0.0.1:${HOMEPAGE_PORT:?Set HOMEPAGE_PORT}:3000"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ./admin.json
        target: /run/cloudpage/admin.json
        read_only: true
        bind: {create_host_path: false}
    networks: [private]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/auth/signin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  private:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
